# Integração contínua do Connexa: roda em todo pull request e em todo push no main.
# É o mesmo conjunto de verificações do ./verificar.
# A proteção do branch main deve exigir os três jobs abaixo antes do merge.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (testes e fronteiras)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: connexa
          POSTGRES_PASSWORD: connexa
          POSTGRES_DB: connexa_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connexa -d connexa_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
      - name: Compilação (avisos são erros)
        run: dotnet build Connexa.slnx
      - name: Testes de aceitação e verificação de fronteiras
        run: dotnet test --no-build --report-trx
      - name: Relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-backend
          path: backend/TestResults/
          if-no-files-found: ignore

  frontend:
    name: Front-end (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  instrucoes-do-agente:
    name: Instruções do agente sincronizadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: AGENTS.md e .github/copilot-instructions.md devem ser idênticos
        run: |
          if ! cmp -s AGENTS.md .github/copilot-instructions.md; then
            echo "::error::AGENTS.md e .github/copilot-instructions.md estão diferentes. Altere os dois juntos."
            exit 1
          fi
